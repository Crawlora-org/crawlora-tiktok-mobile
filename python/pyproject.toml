[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crawlora-tiktok-mobile"
version = "0.1.0"
description = "Crawlora TikTok Mobile API client with 63 endpoints for mobile feed, search, video, creator, music, LIVE, and place endpoints"
readme = "README.md"
keywords = ["crawlora", "api-client", "sdk", "web-scraping", "scraping-api", "tiktok-mobile", "tiktok-mobile-api", "tiktok-mobile-scraper", "tiktok-mobile-data", "tiktok-mobile-mobile-feed", "tiktok-mobile-search", "tiktok-mobile-video", "tiktok-mobile-creator", "tiktok-mobile-music", "tiktok-mobile-live", "tiktok-mobile-place-endpoints"]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Crawlora" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Typing :: Typed",
]
dependencies = ["typing-extensions>=4.7; python_version < '3.11'"]

[project.optional-dependencies]
async = ["httpx>=0.27"]
test = ["mypy>=1.11", "pytest>=8"]

[project.urls]
Homepage = "https://crawlora.net/?utm_source=pypi&utm_medium=referral&utm_campaign=platform-clients&utm_content=tiktok-mobile-python-homepage"
Documentation = "https://crawlora.net/docs?utm_source=pypi&utm_medium=referral&utm_campaign=platform-clients&utm_content=tiktok-mobile-python-api-docs"
Repository = "https://github.com/Crawlora-org/crawlora-tiktok-mobile"

[tool.setuptools.packages.find]
where = ["."]
include = ["crawlora_tiktok_mobile"]

[tool.setuptools.package-data]
"crawlora_tiktok_mobile" = ["py.typed", "*.pyi"]
